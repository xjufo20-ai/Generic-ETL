version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: etl-postgres
    environment:
      POSTGRES_DB: etldb
      POSTGRES_USER: etl
      POSTGRES_PASSWORD: etlpass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./config/sql/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata:
