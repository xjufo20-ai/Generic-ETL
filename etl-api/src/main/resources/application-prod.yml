# ── Prod profile: PostgreSQL, minimal logging, production defaults ──
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/etldb_prod
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER}
    password: ${DB_PASS}

logging:
  level:
    com.generic.etl: WARN
    org.apache.camel: ERROR

etl:
  retry:
    max-retries: 3

server:
  shutdown: graceful
  tomcat:
    max-connections: 200
    threads:
      max: 50

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: http://eureka-prod:8761/eureka/
