# ── Dev profile ──
spring:
  datasource:
    url: jdbc:h2:mem:etldb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.generic.etl: DEBUG
    org.apache.camel: INFO
    org.springframework.security: DEBUG

etl:
  retry:
    max-retries: 1
  api-keys: dev-admin:ADMIN,dev-operator:OPERATOR,dev-viewer:VIEWER
