# ── Shared base config (applied to all profiles) ──
server:
  port: 8080

spring:
  application:
    name: generic-etl
  profiles:
    active: dev

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# ── Eureka (disabled by default; enable per profile) ──
eureka:
  client:
    enabled: false
    service-url:
      defaultZone: http://localhost:8761/eureka/

# ── API Key auth (override per profile) ──
# Format: "key:ROLE,key2:ROLE2"
etl:
  api-keys: sk-admin:ADMIN,sk-operator:OPERATOR,sk-viewer:VIEWER
