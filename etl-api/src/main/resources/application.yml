server:
  port: 8080

spring:
  application:
    name: generic-etl
  datasource:
    url: jdbc:h2:mem:etldb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.generic.etl: DEBUG
    org.apache.camel: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
