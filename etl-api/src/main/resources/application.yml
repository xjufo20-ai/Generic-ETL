# ── Shared base config (applied to all profiles) ──
server:
  port: 8080

spring:
  application:
    name: generic-etl
  profiles:
    active: dev

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,camelroutes
  endpoint:
    health:
      show-details: always

# ── Camel ──
camel:
  springboot:
    name: GenericETL
    main-run-controller: true
  error-handler:
    enabled: true
  metrics:
    enable-route-policy: true

# ── Eureka (disabled by default; enable per profile) ──
eureka:
  client:
    enabled: false
    service-url:
      defaultZone: http://localhost:8761/eureka/

# ── API Key auth ──
etl:
  api-keys: sk-admin:ADMIN,sk-operator:OPERATOR,sk-viewer:VIEWER
