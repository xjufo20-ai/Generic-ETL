plugins { id 'org.springframework.boot' }
ext { springCloudVersion = '2023.0.3'; camelVersion = '4.7.0' }

dependencies {
    implementation project(':etl-common'); implementation project(':etl-core')
    implementation project(':etl-load')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    // Apache Camel
    implementation "org.apache.camel.springboot:camel-spring-boot-starter:${camelVersion}"
    implementation "org.apache.camel:camel-jdbc:${camelVersion}"
    implementation "org.apache.camel:camel-csv:${camelVersion}"
    implementation "org.apache.camel:camel-kafka:${camelVersion}"
    implementation "org.apache.camel:camel-ftp:${camelVersion}"
    implementation "org.apache.camel:camel-management:${camelVersion}"
    implementation "org.apache.camel:camel-yaml-dsl:${camelVersion}"
    // Hawtio (brings jolokia transitively)
    implementation 'io.hawt:hawtio-springboot:4.2.0'
    runtimeOnly 'org.postgresql:postgresql:42.7.4'
    runtimeOnly 'com.h2database:h2'
    testImplementation 'org.apache.camel:camel-test-spring-junit5:4.7.0'
}

dependencyManagement {
    imports { mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}" }
}
