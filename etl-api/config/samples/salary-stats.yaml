# ============================================================
# Generic-ETL Pipeline: Salary Statistics (Camel 4.8 format)
# ============================================================

- route:
    id: salary-stats
    from:
      uri: jdbc:etlDataSource
      parameters:
        query: >
          SELECT emp_id, emp_name, dept_code, salary_amt, hire_dt
          FROM employees WHERE hire_dt >= '2020-01-01'
      steps:
        # 1) Project
        - setHeader:
            name: mappings
            constant: '{"emp_id":"id","emp_name":"name","dept_code":"dept","salary_amt":"salary"}'
        - bean:
            ref: projectTransformer
        # 2) Filter
        - setHeader:
            name: filterExpr
            constant: 'salary > 5000'
        - bean:
            ref: rowFilter
        # 3) Aggregate
        - setHeader:
            name: etlAgg
            constant: '{"groupBy":["dept"],"aggregations":[{"field":"salary","function":"SUM","alias":"total_salary"},{"field":"id","function":"COUNT","alias":"employee_count"},{"field":"salary","function":"AVG","alias":"avg_salary"}]}'
        - bean:
            ref: etlAggregator
        # 4) Output
        - setProperty:
            name: pipelineName
            constant: salary-stats
        - multicast:
            steps:
              - to: bean:loadRouter
              - to:
                  uri: file:data
                  parameters:
                    fileName: salary_stats.csv
